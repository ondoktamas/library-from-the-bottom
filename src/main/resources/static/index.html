<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Admin</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">📚 Library Admin</div>
    <nav class="nav">
      <button class="nav-item active" data-panel="books">Books</button>
      <button class="nav-item" data-panel="borrowers">Borrowers</button>
      <button class="nav-item" data-panel="loans">Loans</button>
    </nav>
  </aside>

  <main class="content">
    <div id="toast" class="toast" hidden></div>

    <section id="panel-books" class="panel active">
      <div class="panel-header">
        <h1>Books</h1>
        <button class="btn btn-primary" id="add-book-btn">+ Add Book</button>
      </div>
      <div class="filter-bar">
        <input type="text" id="filter-id" placeholder="Filter by ID">
        <input type="text" id="filter-title" placeholder="Filter by title">
        <input type="text" id="filter-author" placeholder="Filter by author">
        <button class="btn btn-secondary" id="clear-filters-btn">Clear</button>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>Title</th><th>Author</th><th>Year</th><th>Edition</th><th>Status</th><th>ID</th><th></th></tr>
        </thead>
        <tbody id="books-tbody"></tbody>
      </table>
      <p class="empty-state" id="books-empty" hidden>No books match. Add one or adjust the filters.</p>
    </section>

    <section id="panel-borrowers" class="panel">
      <div class="panel-header">
        <h1>Borrowers</h1>
        <button class="btn btn-primary" id="add-borrower-btn">+ Add Borrower</button>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>Name</th><th>Date of Birth</th><th>Address</th><th>ID</th><th></th></tr>
        </thead>
        <tbody id="borrowers-tbody"></tbody>
      </table>
      <p class="empty-state" id="borrowers-empty" hidden>No borrowers yet. Add one to get started.</p>
    </section>

    <section id="panel-loans" class="panel">
      <div class="panel-header">
        <h1>Loans</h1>
      </div>
      <div class="pair-form">
        <select id="pair-book-select"></select>
        <select id="pair-borrower-select"></select>
        <button class="btn btn-primary" id="pair-btn">Pair (Borrow)</button>
      </div>
      <table class="data-table">
        <thead>
          <tr><th>Book</th><th>Borrower</th><th>Borrowed At</th><th></th></tr>
        </thead>
        <tbody id="loans-tbody"></tbody>
      </table>
      <p class="empty-state" id="loans-empty" hidden>No active loans.</p>
    </section>
  </main>
</div>

<div class="modal-overlay" id="modal-overlay" hidden>
  <div class="modal">
    <h2 id="modal-title">Add Book</h2>
    <form id="modal-form">
      <div id="modal-fields"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
